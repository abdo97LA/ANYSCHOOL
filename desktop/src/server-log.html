<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>UniTimetable — journaux du serveur</title>
<style>
body{margin:0;background:#10131b;color:#d8dee9;font:13px/1.45 Consolas,"Cascadia Mono",monospace;display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#1a1f2b;border-bottom:1px solid #2b3243;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px}
#st{padding:2px 10px;border-radius:10px;font-weight:600}
.stopped{background:#475569}.starting{background:#b45309}.running{background:#15803d}.error{background:#b91c1c}
button{font:inherit;padding:4px 10px;border-radius:6px;border:1px solid #3b4357;background:#232a39;color:#e8eaf0;cursor:pointer}
#log{flex:1;overflow:auto;padding:8px 12px;white-space:pre-wrap;word-break:break-word}
.l-ERROR{color:#fca5a5}.l-WARN{color:#fcd34d}.f{color:#64748b}
#detail{color:#98a0b3;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header><b>Journaux du serveur</b><span id="st" class="stopped">…</span><span id="detail"></span>
<label><input type="checkbox" id="follow" checked> suivre</label><button id="clr">Effacer l’affichage</button><button id="dir">Ouvrir le dossier</button></header>
<div id="log" aria-live="polite"></div>
<script>
const api = window.electronAPI.serverControl, L = document.getElementById('log');
const LABEL = { stopped: 'Arrêté', starting: 'Démarrage…', running: 'En marche', error: 'Erreur' };
function status(s) { const e = document.getElementById('st'); e.className = s.state; e.textContent = LABEL[s.state] || s.state; document.getElementById('detail').textContent = (s.detail || '') + (s.port ? ' · port ' + s.port : '') + (s.logDir ? ' · ' + s.logDir : ''); }
function add(lines) {
  const frag = document.createDocumentFragment();
  for (const x of lines) { const d = document.createElement('div'); const m = /^\S+\s+(ERROR|WARN|INFO)/.exec(x.line); if (m) d.className = 'l-' + m[1]; const f = document.createElement('span'); f.className = 'f'; f.textContent = x.file.replace(/\.log$/, '') + '  '; d.appendChild(f); d.appendChild(document.createTextNode(x.line)); frag.appendChild(d); }
  L.appendChild(frag); while (L.childNodes.length > 5000) L.removeChild(L.firstChild);
  if (document.getElementById('follow').checked) L.scrollTop = L.scrollHeight;
}
document.getElementById('clr').onclick = () => { L.textContent = ''; };
document.getElementById('dir').onclick = () => api.openLogFolder();
api.onStatus(status); api.onLog(add);
api.logInit().then(r => { if (!r.ok) { L.textContent = r.error || 'Accès refusé.'; return; } status(r.status); if (!r.files.length) L.textContent = 'Aucun journal pour l’instant.'; add(r.lines); });
</script>
</body>
</html>
